# Copyright 2026 Gabriel Ignat
# SPDX-License-Identifier: AGPL-3.0-only

# Copyright and licence of the files that carry no header of their own
# (https://reuse.software/spec-3.3/): documentation, configuration files,
# workflows and anything else that can't or doesn't take a comment. A file
# with its own header, as every Go file has, keeps it ("closest"). The reuse
# workflow runs `reuse lint`.
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "Copyright 2026 Gabriel Ignat"
SPDX-License-Identifier = "AGPL-3.0-only"

# The JSON Schemas of the documents infra-ontology writes (snapshot, node,
# edge, source and answer) and the notes beside them are Apache-2.0, so that
# any tool, open or not, can validate the documents and generate types from
# the schemas. The code that writes and validates the documents stays
# AGPL-3.0-only.
[[annotations]]
path = ["schemas/*.schema.json", "schemas/*.md"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2026 Gabriel Ignat"
SPDX-License-Identifier = "Apache-2.0"
