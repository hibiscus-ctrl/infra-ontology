# Release build skeleton. Nothing publishes from it yet: there is no release
# workflow, and no tag is cut until the owner says. Run `goreleaser release
# --snapshot --clean --skip=sbom,sign` to try it locally.
#
# The query engine needs cgo, so the final build is split per native runner
# (Linux and macOS on amd64 and arm64, no Windows in v0). Until that lands this
# single pure-Go build, with the noduckdb tag (no query engine), is the
# placeholder: without the tag a CGO_ENABLED=0 build fails.
version: 2
project_name: infra-ontology

builds:
  - id: infra-ontology
    main: ./cmd/infra-ontology
    binary: infra-ontology
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    tags:
      - noduckdb
    ldflags:
      - -s -w -X github.com/hibiscus-ctrl/infra-ontology/internal/version.Version=v{{ .Version }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    # Reproducible: the same commit gives the same binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: infra-ontology
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - LICENSES/AGPL-3.0-only.txt
      - LICENSES/Apache-2.0.txt
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

# Releases are drafts: the owner publishes them.
release:
  draft: true
  prerelease: auto

changelog:
  disable: true
