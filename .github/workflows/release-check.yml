name: Release check

# A trial run of the release build on a pull request that touches the release
# files: the same matrix as a release, in snapshot mode. It signs and
# publishes nothing.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build-release.yml
      - .github/workflows/release.yml
      - .github/workflows/release-check.yml
      - scripts/check-ldd.sh
      - scripts/package-release.sh
      - scripts/smoke-release.sh
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: snapshot build
    uses: ./.github/workflows/build-release.yml
    with:
      version: snapshot
